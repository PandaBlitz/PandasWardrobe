name: Bug Report
description: Report a crash, error, or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below as completely as you can.

  - type: input
    id: mc-version
    attributes:
      label: Minecraft Version
      placeholder: "e.g. 1.21.1"
    validations:
      required: true

  - type: input
    id: neoforge-version
    attributes:
      label: NeoForge Version
      placeholder: "e.g. 21.1.251"
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: PandaWardrobe Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open the wardrobe
        2. Click the helmet button
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Crash Report / Log
      description: Paste the relevant crash report or latest.log content (or a link to a pastebin/gist).
      render: shell
    validations:
      required: false

  - type: textarea
    id: other-mods
    attributes:
      label: Other Mods Installed
      description: List any other mods present if this might be a compatibility issue (or "none" / "vanilla NeoForge" if standalone).
    validations:
      required: false